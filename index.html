<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Lumen — Long Exposure. An archive of people, places and moments."
    />

    <meta name="theme-color" content="#0f0f0f" />

    <title>Realevate — Long Exposure</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <!-- NAVIGATION -->

    <nav class="navigation">
      <div class="nav-item">
        <a href="#archive">Archive</a>
      </div>

      <div class="nav-item nav-brand">
        <a href="/" aria-label="Lumen Home">LUMEN</a>
      </div>

      <div class="nav-item">
        <a href="#commission">Commission</a>
      </div>
    </nav>

    <!-- MAIN -->

    <main>
      <section class="hero" id="archive">
        <!-- MARQUEE -->

        <div class="marquee">
          <div class="marquee-track">
            <h1>Long Exposure</h1>
            <h1>Long Exposure</h1>
            <h1>Long Exposure</h1>
            <h1>Long Exposure</h1>
          </div>
        </div>

        <!-- BLACK INTRO OVERLAY -->

        <div class="hero-overlay">
          <!-- COUNTER MUST STAY INSIDE THE OVERLAY -->

          <div class="counter" aria-label="Image counter">
            <div class="digit-col"></div>

            <div class="digit-col"></div>
          </div>
        </div>

        <!-- IMAGE REVEAL -->

        <div class="hero-img-wrapper">
          <div class="hero-img">
            <img
              src="/images/img1.webp"
              alt="Editorial photograph one"
              fetchpriority="high"
            />
          </div>

          <div class="hero-img">
            <img src="/images/img2.webp" alt="Editorial photograph two" />
          </div>

          <div class="hero-img">
            <img src="/images/img3.webp" alt="Editorial photograph three" />
          </div>

          <div class="hero-img">
            <img src="/images/img4.webp" alt="Editorial photograph four" />
          </div>

          <div class="hero-img">
            <img src="/images/img5.webp" alt="Editorial photograph five" />
          </div>

          <div class="hero-img">
            <img src="/images/img6.webp" alt="Editorial photograph six" />
          </div>
        </div>

        <!-- HERO DESCRIPTION -->

        <div class="hero-copy">
          <p>
            A growing archive of people, places and the small moments between
            them.
          </p>

          <div class="hero-callout">
            <p>Exhibition Opens 14 Nov</p>
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->

    <footer>
      <p>Lumen &copy; 2026</p>

      <p>Est. Copenhagen</p>
    </footer>

    <!-- JAVASCRIPT -->

    <script type="module" src="/script.js"></script>
  </body>
</html>
